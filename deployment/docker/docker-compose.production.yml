version: "3.9"

# ==============================================================================
# ORION BAS AI Copilot — Production Docker Compose
# Hardened configuration with resource reservations and process supervision
# ==============================================================================

services:
  backend:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.backend
    container_name: orion-prod-backend
    environment:
      - ORION_ENV=production
      - ORION_API_HOST=0.0.0.0
      - ORION_API_PORT=8000
      - ORION_API_WORKERS=2
      - ORION_STREAMING_ENABLED=true
      - ORION_STREAMING_PORT=8080
      - ORION_CAMERA_SOURCE=assets/sample_replay.mp4
      - ORION_HARDWARE_ACCELERATOR=cpu
    ports:
      - "8000:8000"
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ../../data:/app/data
      - ../../logs:/app/logs
      - ../../recordings:/app/recordings
    restart: always
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8192M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health/live"]
      interval: 10s
      timeout: 3s
      retries: 3
