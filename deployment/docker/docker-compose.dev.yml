version: "3.9"

services:
  backend:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.backend
    container_name: orion-dev-backend
    environment:
      - ORION_ENV=development
      - ORION_API_HOST=0.0.0.0
      - ORION_API_PORT=8000
    ports:
      - "8000:8000"
      - "9090:9090"
    volumes:
      - ../../backend:/app/backend
      - ../../ai:/app/ai
      - ../../configs:/app/configs
      - ../../data:/app/data
      - ../../logs:/app/logs
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    container_name: orion-dev-frontend
    working_dir: /app
    volumes:
      - ../../frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    depends_on:
      - backend
