name: "Security & Vulnerability Audit"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # Every Monday 04:00 UTC

jobs:
  security-scan:
    name: "Bandit & Safety Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Run Bandit AST Security Analysis
        run: |
          uv run bandit -r backend/src ai/src datasets/src -ll

      - name: Run Safety Dependency Vulnerability Audit
        run: |
          uv run safety check --ignore 70612 || true
