- alert_id: ALERT-STEP-SKIPPED
  trigger: step_skipped
  severity: WARNING
  spoken_message: Step skipped. Please perform the required step.
- alert_id: ALERT-OUT-OF-SEQUENCE
  trigger: out_of_sequence
  severity: WARNING
