  expected_activity: pick_yellow
  expected_actions:
  - pick_yellow
  - pick
  optional: false
  allowed_transitions:
  - E05_A_S02
  timeouts:
    nominal_duration_seconds: 30
    max_timeout_seconds: 90
  thresholds:
    activity_confidence_min: 0.65
    pose_tracking_stability_min: 0.75
    interaction_proximity_px: 100.0
