  title: E05 In Container (Variant A)
  lead_agency: ISRO HSFC
  station_module: BAS-SCIENCE-NODE-1
  glovebox_id: GB-01
  principal_investigator: Astronaut Scientist / HSFC Payload Specialist
  date_approved: '2026-09-14'
