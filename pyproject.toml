[project]
name = "orion-bas-ai"
version = "0.1.0-alpha.0"
description = "Offline AI Human Activity Recognition System for Bharatiya Antariksh Station (BAS) Experiments"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary / ISRO-BAS Consortium" }
authors = [
    { name = "Bharatiya Antariksh Station AI Systems Engineering Group", email = "ai-systems@isro.gov.in" }
]
keywords = [
    "aerospace",
    "space-station",
    "bharatiya-antariksh-station",
    "human-activity-recognition",
    "computer-vision",
    "offline-first",
    "fastapi",
    "edge-ai"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

dependencies = [
    # Core Infrastructure
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "typing-extensions>=4.12.0",

    # Database & Migrations
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",

    # Scientific Computing & Computer Vision Interfaces
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.14.0",
    "pillow>=11.0.0",
    "opencv-python>=4.11.0.86",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "ultralytics>=8.3.0",
    "onnxruntime>=1.19.0",

    # Observability & Telemetry
    "structlog>=24.4.0",
    "loguru>=0.7.3",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "black>=24.10.0",
    "isort>=5.13.2",
    "mypy>=1.14.0",
    "pre-commit>=4.1.0",
    "bandit>=1.8.0",
    "safety>=3.2.0",
    "types-pyyaml>=6.0.12.20241230",
]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.124.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]
profiling = [
    "pyinstrument>=4.7.0",
    "memory-profiler>=0.61.0",
]
all = [
    "orion-bas-ai[dev,test,docs,profiling]"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "backend/src/orion",
    "ai/src/orion_ai",
    "datasets/src/orion_datasets",
    "experiments",
]

# ------------------------------------------------------------------------------
# Ruff Configuration (Linting & Formatting)
# ------------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend/src", "ai/src", "datasets/src", "tests", "scripts", "tools"]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "dist",
    "build",
    "migrations",
    "frontend",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "C90",  # McCabe complexity
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "ASYNC",# flake8-async
    "S",    # flake8-bandit
    "BLE",  # flake8-blind-except
    "A",    # flake8-builtins
    "COM",  # flake8-commas
    "C4",   # flake8-comprehensions
    "T10",  # flake8-debugger
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "G",    # flake8-logging-format
    "PIE",  # flake8-pie
    "T20",  # flake8-print
    "PT",   # flake8-pytest-style
    "Q",    # flake8-quotes
    "RSE",  # flake8-raise
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "TCH",  # flake8-type-checking
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate (commented-out code)
    "PL",   # Pylint
    "RUF",  # Ruff-specific rules
]
ignore = [
    "COM812", # Missing trailing comma (handled by formatter)
    "ISC001", # Single line implicit string concat (handled by formatter)
    "S101",   # Use of assert (allowed in tests)
    "PLR0913",# Too many arguments in function call (common in scientific constructors)
    "RUF001", # Ambiguous unicode character (emojis in console logs)
    "RUF002", # Ambiguous character in docstring
    "RUF003", # Ambiguous character in comment
    "E501",   # Line length handled by formatter
    "S105",   # Possible hardcoded password string in dev settings
    "S106",   # Possible hardcoded password argument in dev settings
    "B008",   # Do not perform function call Depends in argument defaults (FastAPI standard)
    "PLW0603",# Global statement in singleton factories
    "RUF012", # Mutable default value for class attribute in static registries
    "BLE001", # Blind except Exception for aerospace fault isolation
    "PLC0415",# Lazy import for model registry isolation
    "ASYNC240",# Local file existence check in async health probes and initializers
    "PLR0912",# Too many branches in multi-stage tracker association
    "PLR0915",# Too many statements in multi-stage tracking algorithms
    "PLR0917",# Too many positional arguments in hardware and coordinator constructors
    "PLR0911",# Too many return statements in state transitions
    "PLR2004",# Magic value used in comparison
    "TCH",    # Flake8-type-checking (causes runtime pydantic type resolution issues)
    "ARG002", # Unused method argument in polymorphic methods
    "SIM102", # Nested if statements
    "C901",   # Complex branching in multi-stage object tracking algorithms
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG", "PLR2004", "T201", "S106", "PTH123", "F401", "ASYNC240", "PLR0915", "TCH"]
"scripts/**" = ["T201", "S603", "S607", "BLE001", "PLC0415", "PLR0912", "PLR0915", "PLR2004", "PLW1510", "PTH118", "PTH110", "PTH107"]
"backend/migrations/**" = ["ERA001", "F401"]
"backend/src/orion/db/models/**" = ["A003", "A002"]

# ------------------------------------------------------------------------------
# Black Configuration (Code Formatting Fallback / Compatibility)
# ------------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.mypy_cache
  | \.pytest_cache
  | migrations
  | frontend
)/
'''

# ------------------------------------------------------------------------------
# isort Configuration
# ------------------------------------------------------------------------------
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["**/migrations/*", "**/frontend/*"]

# ------------------------------------------------------------------------------
# Mypy Strict Configuration
# ------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
mypy_path = ["backend/src", "ai/src", "datasets/src"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "cv2.*",
    "PIL.*",
    "prometheus_client.*",
    "opentelemetry.*",
    "hypothesis.*",
    "alembic.*",
    "ultralytics.*",
    "torch.*",
    "torchvision.*",
]
ignore_missing_imports = true

# ------------------------------------------------------------------------------
# Pytest Configuration
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [
    ".",
    "backend/src",
    "ai/src",
    "datasets/src",
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "-ra",
]
markers = [
    "unit: Unit tests verifying isolated components",
    "integration: Integration tests with database or filesystem",
    "contract: Schema and serialization contract tests",
    "benchmark: Performance benchmark suites",
    "slow: Tests taking > 5 seconds",
]

# ------------------------------------------------------------------------------
# Coverage Configuration
# ------------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["backend/src", "ai/src", "datasets/src"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]
